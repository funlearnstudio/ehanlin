<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>成績單</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                 "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
    color: #24435f;
    background:
      linear-gradient(rgba(255,255,255,.86), rgba(255,255,255,.86)),
      radial-gradient(circle at 30px 30px, #d9e0e5 1px, transparent 1.5px);
    background-size: auto, 42px 42px;
  }

  .demo-banner {
    position: sticky;
    top: 0;
    z-index: 50;
    text-align: center;
    padding: 8px 12px;
    background: #ffe7a6;
    color: #5d4700;
    font-weight: 700;
    letter-spacing: .5px;
    border-bottom: 1px solid #e6c96b;
  }

  header {
    height: 70px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 34px;
    border-bottom: 1px solid #e6ebef;
  }
  
  .header-image {
    width: 245px;
    height: 48px;
    object-fit: contain;
  }

  .top-links {
    display: flex;
    gap: 28px;
    font-size: 18px;
    color: #1872b7;
    font-weight: 600;
  }

  main {
    width: min(1130px, calc(100% - 36px));
    margin: 14px auto 70px;
  }

  .back {
    color: #1598cb;
    font-weight: 700;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .nav {
    display: grid;
    grid-template-columns: repeat(6, 1fr) 64px;
    background: #08a0cc;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 2px 3px rgba(0,0,0,.18);
    margin-bottom: 30px;
  }
  .nav div {
    padding: 16px 8px;
    color: #fff;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    border-right: 1px dashed rgba(255,255,255,.75);
    cursor: pointer;
  }
  .nav div:last-child { border-right: 0; }

  .panel {
    background: #fff;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.16);
    margin-bottom: 30px;
  }
  .panel-title {
    background: #0e2d47;
    color: #fff;
    font-size: 25px;
    font-weight: 700;
    padding: 15px 28px;
  }

  .score-content {
    padding: 34px 40px 26px;
    display: grid;
    grid-template-columns: 230px 1fr 300px;
    gap: 28px;
    align-items: center;
  }

  .profile-image {
    width: 145px;
    height: 145px;
    object-fit: cover;
    display: block;
    margin: auto;
    border-radius: 18px;
    border: 4px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }
  .student-name {
    text-align: center;
    margin-top: 8px;
    font-size: 20px;
    font-weight: bold;
    color: #2d4356;
  }

  .meta {
    font-size: 17px;
    line-height: 1.72;
  }
  .meta b { color: #243a4e; }
  .meta .blue { color: #2583c6; font-weight: bold; }

  .score-box {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 14px 20px;
  }
  .score-label {
    font-size: 17px;
    font-weight: 700;
    text-align: right;
  }
  .big {
    font-size: 70px;
    line-height: .9;
    font-weight: 300;
    color: #2b4963;
  }
  .unit {
    font-size: 26px;
    margin-left: 7px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 14px 28px 10px;
    align-items: center;
  }
  .tab {
    padding: 11px 18px;
    background: #eef2f4;
    border-radius: 4px;
    color: #667d8d;
    font-weight: 700;
    cursor: pointer;
  }
  .tab.active {
    background: #0aa3cc;
    color: #fff;
  }
  .tab.warning {
    background: #ff6433;
    color: #fff;
  }

  .pagination {
    margin-left: auto;
    padding: 11px 18px;
    background: #eef2f4;
    border-radius: 4px;
    color: #667d8d;
    font-weight: 700;
    user-select: none;
  }

  table {
    width: calc(100% - 56px);
    margin: 0 28px 28px;
    border-collapse: collapse;
    font-size: 15px;
  }
  th, td {
    padding: 13px 10px;
    text-align: center;
    border-bottom: 1px dashed #dce2e6;
  }
  th { 
    color: #4b6272; 
    background-color: #f7f9fa;
  }
  
  .status-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: bold;
  }
  .status-correct { background: #e3f9e5; color: #1f8a70; }
  .status-wrong { background: #ffe3e3; color: #d93838; }

  @media (max-width: 860px) {
    .top-links { display: none; }
    .nav { grid-template-columns: repeat(3, 1fr); }
    .nav div:last-child { display: none; }
    .score-content {
      grid-template-columns: 1fr;
      text-align: center;
    }
    .score-box { justify-content: center; }
    .score-label { text-align: left; }
    .tabs { flex-wrap: wrap; }
    .pagination { margin-left: 0; width: 100%; text-align: center; }
  }
</style>
</head>
<body>

  <header>
    <img src="header.png" class="header-image" alt="平台 Logo">
    <div class="top-links">
      <span>免費試用</span>
      <span>課程購買</span>
      <span>學習專區</span>
      <span>活動專區</span>
      <span>訊息</span>
    </div>
  </header>

  <main>
    <div class="back">⌂ 回到我的課程</div>

    <nav class="nav">
      <div>▣ 課程內容</div>
      <div>▣ 段考複習</div>
      <div>▣ 考卷專區</div>
      <div>✎ 自我評量</div>
      <div>◇ 個人題庫</div>
      <div>☏ 解題討論</div>
      <div>⚙</div>
    </nav>

    <section class="panel">
      <div class="panel-title">成績單</div>
      <div class="score-content">
        <div>
          <img src="profile.png" class="profile-image" alt="學生頭像">
          <p class="student-name">林炫銓</p>
        </div>

        <div class="meta">
          <div><b>考試範圍：</b>1–3_示範單元</div>
          <div><b>考卷難度：</b>中偏易</div>
          <div><b>考卷答數：</b><span class="blue">40</span></div>
          <div><b>答對答數：</b><span class="blue">38</span></div>
          <div><b>作答時間：</b><span class="blue">22:45</span></div>
          <div><b>開始時間：</b>2026/08/14 下午 16:48:58</div>
          <div><b>交卷時間：</b>2026/08/14 下午 17:12:01</div>
        </div>

        <div class="score-box">
          <div class="score-label">待複習：</div>
          <div><span class="big">2</span><span class="unit">題</span></div>
          <div class="score-label">我的分數：</div>
          <div><span class="big">95</span><span class="unit">分</span></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">▧ 答題狀態</div>

      <div class="tabs">
        <div class="tab active">↗ 全部試題</div>
        <div class="tab">⊗ 待複習</div>
        <div class="tab">⊗ 答錯題</div>
        <div class="tab warning">⚠ 待檢查</div>
        <div class="pagination">◀ 1 / 2 ▶</div>
      </div>

      <table>
        <thead>
          <tr>
            <th>答題狀態</th>
            <th>題號</th>
            <th>難易度</th>
            <th>答題時間</th>
            <th>平均時間</th>
            <th>知識概念</th>
          </tr>
        </thead>
        <tbody>
          
        </tbody>
      </table>
    </section>
  </main>

</body>
</html>
